name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:   

permissions:
  id-token: write  
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest   
      - run: npm ci
      - run: npm run build
      - run: npm publish
env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
